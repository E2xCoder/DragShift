name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build DragShift.exe
        run: >
          pyinstaller run.py --noconfirm --onefile --windowed --name DragShift
          --icon dragshift/assets/dragshift.ico
          --add-data "dragshift/assets;dragshift/assets"
          --collect-all pillow_heif
          --hidden-import win32com.client
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick
          --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization
          --exclude-module tkinter

      - name: Smoke-test the built .exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\DragShift.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          "Self-test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: DragShift-windows
          path: dist/DragShift.exe

      - name: Publish download (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DragShift (latest build)
          make_latest: true
          body: |
            Download **DragShift.exe** below, double-click it, and look for the rainbow ring in your system tray.
            Built automatically from commit ${{ github.sha }}.
          files: dist/DragShift.exe

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DragShift.exe
