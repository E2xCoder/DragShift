name: End-to-end test (real Mac desktop)

on:
  push:
    branches: [main, e2e-mac]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e-mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt imageio-ffmpeg pyautogui

      - name: Run end-to-end scenarios on the Finder desktop
        run: python demo/e2e_mac.py

      - name: Summary
        if: always()
        run: cat e2e_mac_out/results.md >> $GITHUB_STEP_SUMMARY || true

      - name: Save results to the e2e-mac-output branch
        if: always()
        run: |
          mkdir -p /tmp/o && cp -r e2e_mac_out/* /tmp/o/ || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan e2e-mac-output
          git rm -rfq . || true
          cp -r /tmp/o/* . || true
          git add -A
          git commit -qm "macOS E2E results ${GITHUB_SHA}" || true
          git push -f origin e2e-mac-output
